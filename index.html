<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMDRIVE Booking</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- OpenStreetMap Leaflet Map CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }
        .form-group {
            margin-bottom: 15px;
            position: relative;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        /* Map container styling */
        #map {
            height: 220px;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-top: 8px;
            margin-bottom: 10px;
            z-index: 1;
        }
        .gps-btn {
            background-color: #34c759;
            color: #ffffff;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button.submit-btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 30px;
        }
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            border: 1px solid #ccc;
            border-radius: 0 0 8px 8px;
            max-height: 180px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.15);
        }
        .suggestion-item {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h3 style="text-align: center;">🚗 MMDRIVE Booking</h3>

    <div class="form-group">
        <label>Booking Mode:</label>
        <select id="mode" onchange="toggleFields()">
            <option value="INSTANT">⚡ Book Now (ASAP)</option>
            <option value="SCHEDULED">📅 Schedule for Later</option>
        </select>
    </div>

    <div id="datetime-group" style="display: none;">
        <div class="form-group">
            <label>Pickup Date:</label>
            <input type="date" id="date">
        </div>
        <div class="form-group">
            <label>Pickup Time:</label>
            <input type="time" id="time">
        </div>
    </div>

    <div class="form-group">
        <label>Select Vehicle:</label>
        <select id="vehicle" onchange="toggleFields()">
            <option value="Kilo Car">🚕 Kilo Car</option>
            <option value="Sedan">Sedan</option>
            <option value="SUV">SUV</option>
            <option value="Alphard / VIP">Alphard / VIP</option>
        </select>
    </div>

    <div class="form-group">
        <label>Select Package:</label>
        <select id="hours"></select>
    </div>

    <!-- Pickup Section with Map -->
    <div class="form-group">
        <label>Pickup Location:</label>
        <button type="button" class="gps-btn" onclick="getCurrentGPS('pickup')">📍 Use My Current Location (GPS)</button>
        <input type="text" id="pickup" placeholder="Type location or tap pin on map..." autocomplete="off" oninput="handleSearch('pickup', 'pickup-suggestions')">
        <div id="pickup-suggestions" class="suggestions-list"></div>
        <div id="map"></div>
        <input type="hidden" id="pickup_lat">
        <input type="hidden" id="pickup_lng">
    </div>

    <!-- Dropoff Section -->
    <div class="form-group" id="dropoff-group">
        <label>Drop-off Address:</label>
        <button type="button" class="gps-btn" onclick="getCurrentGPS('dropoff')">📍 Set Drop-off to My GPS</button>
        <input type="text" id="dropoff" placeholder="Type drop-off destination..." autocomplete="off" oninput="handleSearch('dropoff', 'dropoff-suggestions')">
        <div id="dropoff-suggestions" class="suggestions-list"></div>
        <input type="hidden" id="drop_lat">
        <input type="hidden" id="drop_lng">
    </div>

    <div class="form-group">
        <label>Phone Number:</label>
        <input type="tel" id="phone" placeholder="e.g. 09123456789">
    </div>

    <button class="submit-btn" onclick="sendBooking()">Preview & Confirm</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Default map center: Yangon, Myanmar
        let defaultLat = 16.8661;
        let defaultLng = 96.1951;
        let map, pickupMarker, dropoffMarker;

        const packages = {
            "Kilo Car": [{ value: "1", text: "Point-to-Point (Min 5km 8,500 MMK)" }],
            "Sedan": [
                { value: "3", text: "3 Hours (75,000 MMK)" },
                { value: "5", text: "5 Hours (100,000 MMK)" },
                { value: "8", text: "8 Hours (160,000 MMK)" }
            ],
            "SUV": [
                { value: "3", text: "3 Hours (90,000 MMK)" },
                { value: "5", text: "5 Hours (125,000 MMK)" },
                { value: "8", text: "8 Hours (200,000 MMK)" }
            ],
            "Alphard / VIP": [
                { value: "3", text: "3 Hours (105,000 MMK)" },
                { value: "5", text: "5 Hours (150,000 MMK)" },
                { value: "8", text: "8 Hours (240,000 MMK)" }
            ]
        };

        // Initialize Map
        function initLeafletMap() {
            map = L.map('map').setView([defaultLat, defaultLng], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // Pickup Marker (Green / Draggable)
            pickupMarker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(map);
            pickupMarker.bindPopup("Pickup Location").openPopup();

            pickupMarker.on('dragend', function (e) {
                let position = pickupMarker.getLatLng();
                updateCoordinates('pickup', position.lat, position.lng);
                reverseGeocode(position.lat, position.lng, 'pickup');
            });

            // Map click updates pickup location
            map.on('click', function(e) {
                pickupMarker.setLatLng(e.latlng);
                updateCoordinates('pickup', e.latlng.lat, e.latlng.lng);
                reverseGeocode(e.latlng.lat, e.latlng.lng, 'pickup');
            });
        }

        function updateCoordinates(type, lat, lng) {
            if (type === 'pickup') {
                document.getElementById('pickup_lat').value = lat;
                document.getElementById('pickup_lng').value = lng;
            } else {
                document.getElementById('drop_lat').value = lat;
                document.getElementById('drop_lng').value = lng;
            }
        }

        // Reverse Geocode (Coordinates -> Address)
        function reverseGeocode(lat, lng, inputId) {
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
                .then(res => res.json())
                .then(data => {
                    if (data.display_name) {
                        document.getElementById(inputId).value = data.display_name;
                    }
                })
                .catch(err => console.error(err));
        }

        // GPS Location Fetching
        function getCurrentGPS(type) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    let lat = position.coords.latitude;
                    let lng = position.coords.longitude;

                    updateCoordinates(type, lat, lng);
                    map.setView([lat, lng], 16);

                    if (type === 'pickup') {
                        pickupMarker.setLatLng([lat, lng]);
                    }

                    reverseGeocode(lat, lng, type);
                }, () => {
                    tg.showAlert("Location permission denied. Please select location manually on the map.");
                });
            } else {
                tg.showAlert("GPS location is not supported by your browser.");
            }
        }

        function toggleFields() {
            let mode = document.getElementById("mode").value;
            let vehicle = document.getElementById("vehicle").value;
            
            document.getElementById("datetime-group").style.display = (mode === "SCHEDULED") ? "block" : "none";
            document.getElementById("dropoff-group").style.display = (vehicle === "Kilo Car") ? "block" : "none";

            let hoursSelect = document.getElementById("hours");
            hoursSelect.innerHTML = "";
            packages[vehicle].forEach(pkg => {
                let option = document.createElement("option");
                option.value = pkg.value;
                option.text = pkg.text;
                hoursSelect.appendChild(option);
            });
        }

        // OpenStreetMap Search Handler
        let searchTimer;
        function handleSearch(inputId, listId) {
            clearTimeout(searchTimer);
            const query = document.getElementById(inputId).value.trim();
            const suggestionsContainer = document.getElementById(listId);

            if (query.length < 3) {
                suggestionsContainer.innerHTML = '';
                return;
            }

            searchTimer = setTimeout(() => {
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`)
                    .then(response => response.json())
                    .then(data => {
                        suggestionsContainer.innerHTML = '';
                        data.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.innerText = item.display_name;
                            div.onclick = function() {
                                document.getElementById(inputId).value = item.display_name;
                                updateCoordinates(inputId, item.lat, item.lon);
                                
                                if (inputId === 'pickup') {
                                    map.setView([item.lat, item.lon], 15);
                                    pickupMarker.setLatLng([item.lat, item.lon]);
                                }
                                suggestionsContainer.innerHTML = '';
                            };
                            suggestionsContainer.appendChild(div);
                        });
                    });
            }, 400);
        }

        function sendBooking() {
            let mode = document.getElementById("mode").value;
            let date = document.getElementById("date").value;
            let time = document.getElementById("time").value;
            let pickup = document.getElementById("pickup").value;
            let phone = document.getElementById("phone").value;
            let vehicle = document.getElementById("vehicle").value;

            if (!pickup || !phone) {
                tg.showAlert("Please fill in your Pickup Address and Phone Number.");
                return;
            }
            if (mode === "SCHEDULED" && (!date || !time)) {
                tg.showAlert("Please select a valid Date and Time.");
                return;
            }
            if (vehicle === "Kilo Car" && !document.getElementById("dropoff").value) {
                tg.showAlert("Please select a Drop-off Address for Kilo Car.");
                return;
            }

            let data = {
                mode: mode,
                date: date,
                time: time,
                vehicle: vehicle,
                hours: document.getElementById("hours").value,
                pickup: pickup,
                dropoff: document.getElementById("dropoff").value,
                phone: phone,
                pickup_lat: document.getElementById("pickup_lat").value,
                pickup_lng: document.getElementById("pickup_lng").value,
                drop_lat: document.getElementById("drop_lat").value,
                drop_lng: document.getElementById("drop_lng").value
            };

            tg.sendData(JSON.stringify(data));
        }

        window.onload = function() {
            toggleFields();
            initLeafletMap();
        };
    </script>
</body>
</html>
