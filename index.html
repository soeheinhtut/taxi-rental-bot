<!DOCTYPE html>
<html>
<head>
    <title>Car Rental Booking</title>
    <!-- Essential Telegram WebApp script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h1>Book a Car</h1>
    <button id="submitBtn">Send Booking to Bot</button>

    <script>
        // Initialize the Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById("submitBtn").addEventListener("click", () => {
            // Send data back to the Python bot
            const data = JSON.stringify({ vehicle: "Sedan", hours: 5 });
            tg.sendData(data); 
        });
    </script>
</body>
</html>
